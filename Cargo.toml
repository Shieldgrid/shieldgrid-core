[package]
name = "shieldgrid-core"
version = "0.1.0"
edition = "2021"
description = "Shieldgrid SOC platform core API"
license = "AGPL-3.0"

[dependencies]
anyhow      = "1"
argon2 = "0.5.3"
async-trait = "0.1"
axum        = "0.8"
chrono      = { version = "0.4", features = ["serde"] }
dotenvy     = "0.15"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
password-hash = "0.6.1"
prost = "0.14.4"
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml = "0.9.34"
sqlx        = { version = "0.8", features = ["chrono", "json", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
tokio       = { version = "1", features = ["full"] }
tower-http  = { version = "0.6", features = ["cors"] }
tonic = { version = "0.14.6", features = ["tls-webpki-roots"] }
tonic-prost = "0.14.6"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid        = { version = "1", features = ["v4", "serde"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
time = { version = "0.3.54", features = ["macros"] }

[build-dependencies]
tonic-prost-build = "0.14.6"
